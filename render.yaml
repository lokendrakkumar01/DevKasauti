services:
  - type: web
    name: devkasauti-api
    runtime: node
    buildCommand: npm --prefix apps/api install --omit=dev
    startCommand: npm --prefix apps/api run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Deployment ke baad exact Static Site URL yahan Render dashboard mein set karo.
      - key: WEB_ORIGIN
        value: http://localhost:5173

  - type: web
    name: devkasauti-web
    runtime: static
    buildCommand: npm --prefix apps/web install && npm --prefix apps/web run build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: devkasauti-api
          envVarKey: RENDER_EXTERNAL_URL
